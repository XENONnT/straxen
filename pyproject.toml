[project]
name = "straxen"
version = "4.1.0"
description = "Streaming analysis for XENON"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Straxen contributors, the XENON collaboration" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "strax>=2.2.1",
  "bokeh",
  "commentjson",
  "gitpython",
  "graphviz",
  "immutabledict",
  "matplotlib",
  "multihist>=0.6.3",
  "numba>=0.50.0",
  "numpy",
  "pandas",
  "pymongo",
  "requests",
  "utilix>=0.11.0",
  "xedocs>=0.2.44",
]

[project.urls]
Repository = "https://github.com/XENONnT/straxen"

[project.scripts]
ajax = "straxen.scripts.ajax:main"
bootstrax = "straxen.scripts.bootstrax:main"
microstrax = "straxen.scripts.microstrax:main"
refresh_raw_records = "straxen.scripts.refresh_raw_records:main"
restrax = "straxen.scripts.restrax:main"
straxen_print_versions = "straxen.scripts.straxen_print_versions:main"
straxer = "straxen.scripts.straxer:main"

[project.optional-dependencies]
docs = [
  "myst-parser>=4,<6",
  "nbsphinx>=0.8.9,<1",
  "sphinx>=7,<9",
  "sphinx-rtd-theme>=3,<4",
  "lxml-html-clean",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
preview = true

[tool.docformatter]
recursive = true
in-place = true
style = "sphinx"
wrap-summaries = 100
wrap-descriptions = 100
blank = true
